spring.config.import=optional:classpath:application-local.properties
spring.application.name=FW_07_mvc_prac
logging.pattern.console= %highlight(%d{HH:mm:ss} [%-5level]) %c{36}.%M:%L - %m%n

logging.level.com.ssafy=trace

# TODO: 01-1. 개별적으로 발급받은 키를 등록하세요.
key_kakao_javascript =Your_Key_Here


# TODO: 01-2. JSP 뷰 리졸버 설정을 추가하세요.(ApplicationPropertiesTest.java 참조)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# END

# TODO: 01-3. 파일 업로드 설정을 추가하세요.(ApplicationPropertiesTest.java 참조)
# file 저장 위치
spring.servlet.multipart.location=${user.home}/uploads
# 메모리에 저장하는 최대 크기
spring.servlet.multipart.file-size-threshold=1MB
# 파일당 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 여러 파일 업로드 시 최대 크기
spring.servlet.multipart.max-request-size=50MB


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafylive?serverTimezone=UTC
spring.datasource.username=ssafy
spring.datasource.password=ssafy

spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=600000

mybatis.type-aliases-package=com.ssafy.**.dto

mybatis.mapper-locations=classpath:/mappers/**/*.xml
