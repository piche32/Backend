logging.level.com.ssafy=trace
logging.pattern.console=%d{HH:mm:ss} [%level] %c{36} %m%n

logging.level.org.springframework.jdbc.support.JdbcTransactionManager=TRACE

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# file 저장 위치
spring.servlet.multipart.location=${user.home}/uploads
# 메모리에 저장하는 최대 크기
spring.servlet.multipart.file-size-threshold=10MB
# 파일당 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 여러 파일 업로드 시 최대 크기
spring.servlet.multipart.max-request-size=50MB

# TODO: 02-1. DBUtil에 있는 datasource 연결 설정을 작성해보자.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafylive?serverTimezone=UTC
spring.datasource.username=ssafy
spring.datasource.password=ssafy

spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=600000

# END

# TODO: 02-3. Mybatis 관련 설정을 작성해보자.
# DTO가 있는 곳을 지정해서 mapper에서 fully qualified name을 사용하지 않고 클래스만 사용 가능
# ant style 패턴을 사용하여 하위 경로까지 지정 가능
# 필요하면 쉼표로 여러 개 지정 가능
mybatis.type-aliases-package=com.ssafy.live.*.dto
mybatis.mapper-locations=classpath:mappers/**/*.xml

# END

