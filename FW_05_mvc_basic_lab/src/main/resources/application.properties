spring.application.name=FW_05_MVC_basic


logging.level.com.ssafy=trace
# TODO: 03-1. view resolver를 위한 prefix와 suffix를 설정하세요.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# END


# TODO: 12-2. multipart를 위한 설정을 추가하세요.
# file 저장 위치
spring.servlet.multipart.location=${user.home}/uploads
# 메모리에 저장하는 최대 크기
spring.servlet.multipart.file-size-threshold=1MB
# 파일당 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 여러 파일 업로드 시 최대 크기
spring.servlet.multipart.max-request-size=50MB
